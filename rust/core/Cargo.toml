[package]
name = "aurora_core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "AuroraDownloader Rust core"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = "0.7.16"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["net"] }
